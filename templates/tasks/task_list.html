{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Список задач</h2>

    <!-- Форма фильтра и поиска -->
    <form method="get" class="row g-2 mb-4">
        <div class="col-md-4">
            <select name="category" class="form-select">
                <option value="">Все категории</option>
                {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <input type="text" name="search" placeholder="Поиск по названию" value="{{ search_query }}" class="form-control">
        </div>
        <div class="col-md-4">
            <button type="submit" class="btn btn-primary">Применить</button>
            <a href="{% url 'task_list' %}" class="btn btn-secondary">Сбросить</a>
        </div>
    </form>

    <!-- Список задач -->
    {% if tasks %}
        <ul class="list-group">
            {% for task in tasks %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>{{ task.title }}</strong>
                        <small class="text-muted"> — {{ task.category.name }}</small>
                    </div>
                    <a href="{% url 'task_detail' task.pk %}" class="btn btn-sm btn-outline-primary">Подробнее</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Задач пока нет.</p>
    {% endif %}

    <!-- Кнопка создания -->
    <div class="mt-4">
        <a href="{% url 'task_create' %}" class="btn btn-success">Создать задачу</a>
    </div>
</div>
{% endblock %}
